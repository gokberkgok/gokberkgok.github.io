<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Internet Cafe Tycoon</title>
  <style>
    :root { --bg: #f6f7fb; --card: #fff; --ink: #1d2340; --muted: #5d6385; --accent: #2f6bff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #12152a; --card: #1c2040; --ink: #eef0ff; --muted: #a3a8cc; --accent: #6f9bff; } }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
    .card { background: var(--card); border-radius: 20px; padding: 28px; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: var(--muted); }
    a { color: var(--accent); font-weight: 600; text-decoration: none; }
    ul { padding-left: 18px; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>Internet Cafe Tycoon</h1>
      <p>Kendi internet kafeni kur, bilgisayarları ve mutfağı geliştir, mahalleden şehre büyü.</p>
      <ul>
        <li><a href="privacy.html">Gizlilik Politikası / Privacy Policy</a></li>
      </ul>
    </div>
  </main>
</body>
</html>
